name: Update stock data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 16:30 Taipei, Monday-Friday. GitHub scheduled jobs may be delayed.
    - cron: '30 8 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stockroom-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test calculations and failure handling
        run: python -m unittest discover -s tests -v
      - name: Test personal backup and price conditions
        run: node --test tests/personal.test.cjs
      - name: Restore last successful market snapshot
        uses: actions/cache/restore@v4
        with:
          path: .stockroom-cache
          key: market-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-${{ github.ref_name }}-
      - name: Load cached snapshot
        run: |
          if [ -f .stockroom-cache/market-data.js ]; then cp .stockroom-cache/market-data.js market-data.js; fi
      - name: Fetch completed market sessions
        id: update
        continue-on-error: true
        run: python update_data.py
      - name: Preserve updated snapshot for the next run
        if: steps.update.outcome == 'success'
        run: |
          mkdir -p .stockroom-cache
          cp market-data.js .stockroom-cache/market-data.js
      - name: Save market snapshot cache
        if: steps.update.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .stockroom-cache
          key: market-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check usable snapshot and prepare static site
        run: |
          python -c "from pathlib import Path; from update_data import read_snapshot; s=read_snapshot(Path('market-data.js')); assert any(x.get('price') is not None for x in s.get('stocks',[])), 'No usable real data; deployment stopped'"
          mkdir -p _site
          cp index.html styles.css app.js personal-core.js personal.js market-data.js spec.html stocks.json README.md _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
